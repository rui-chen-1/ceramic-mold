· <time datetime=2026-11-16T11:25:12+08:00>16 Nov 2026 · 11:25</time></span><div class=note-single__text><p>读梁漱溟传及此，又复读方得其妙：</p><blockquote><p>梁漱溟确信中国并非仅仅是诸文化中的一支，而是唯一真正的人类文化。但因为他生活在20世纪，这种信念还是来之不易的，是经过了一番精神上的奥德赛才达到的，不能只看作是梁漱溟对他自幼承袭的自负的顽固坚持</p></blockquote></div><div class="note-single__photos photo-flow"><figure class="figure figure--square" style=--ar:1><div class=figure__mat><a class="figure__well figure__well--square" href=/ceramic-mold/notes/2026-11-16-1125/photo-1_hu_aa37602047b84417.webp data-zoom data-w=2400 data-h=2400 aria-label="View the whole photograph"><img class=figure__img src=/ceramic-mold/notes/2026-11-16-1125/photo-1_hu_75ab533354469fab.webp srcset="/ceramic-mold/notes/2026-11-16-1125/photo-1_hu_75ab533354469fab.webp 700w, /ceramic-mold/notes/2026-11-16-1125/photo-1_hu_39f827504e42b58e.webp 1400w" sizes="(min-width: 820px) 760px, 100vw" width=1400 height=1400 alt=Photograph loading=eager decoding=async></a></div></figure></div></article><nav class=pager aria-label="More notes"><a class=pager__link href=/ceramic-mold/notes/2026-11-02-1257/><span class=mono-label><svg class="arrow arrow--left" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M13 8H3M7 4 3 8l4 4"/></svg> Older note</span><span class=mono-meta>02 Nov 2026</span></a></nav></div></main><footer class=site-footer><span class=mono-meta>© 2026 Ceramic Mold</span><nav class=site-footer__links aria-label=Elsewhere><a class="link mono-meta" href=/ceramic-mold/index.xml>RSS</a>
